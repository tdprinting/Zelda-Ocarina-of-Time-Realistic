plugins {
    id 'com.android.application'
}

// The game's own assets (soh.o2r) are built on the host by Android/build-apk.sh, since the
// asset tools can't run from inside an Android cross-compile.
def sohO2r = file('src/main/assets/soh.o2r')

android {
    namespace 'com.tdprinting.zoot'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.tdprinting.zoot'
        // Android 8.0; the AYN Odin 2 Portal ships Android 13
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            // Snapdragon 8 Gen 2 is 64-bit only
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                targets 'soh'
                arguments '-DANDROID_STL=c++_shared',
                          // SDL goes into libsoh.so, so there's one native library to load
                          '-DSDL_SHARED=OFF',
                          '-DSDL_STATIC=ON',
                          '-DUSE_OPENGLES=ON',
                          '-DHAVE_LD_VERSION_SCRIPT=OFF',
                          // some fetched dependencies still declare cmake_minimum_required < 3.5
                          '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
            }
        }
    }

    buildTypes {
        debug {
            // the decomp is far too slow unoptimized to be playable
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release' } }
        }
        release {
            minifyEnabled false
            // Test builds are signed with the debug key so they install without extra setup
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '4.1.2'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

tasks.named('preBuild') {
    doFirst {
        if (!sohO2r.exists()) {
            throw new GradleException("Missing ${sohO2r}. Build it with Android/build-apk.sh, or copy " +
                "soh.o2r from a desktop build there.")
        }
    }
}
